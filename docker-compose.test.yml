version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: traveloure-test-db
    environment:
      POSTGRES_USER: traveloure_user
      POSTGRES_PASSWORD: traveloure_pass
      POSTGRES_DB: traveloure
    ports:
      - "5432:5432"
    volumes:
      - traveloure_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveloure_user -d traveloure"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  traveloure_test_data:
    driver: local
